<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lire — Gabon Stories</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .story-reader {
      max-width: 750px;
      margin: 0 auto;
      padding: 3rem 2rem;
    }
    .story-meta {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .story-content-text {
      font-size: 1.15rem;
      line-height: 1.9;
      color: var(--texte-sombre);
      white-space: pre-wrap;
    }
    .story-content-text p { margin-bottom: 1.2rem; }
    .story-header-banner {
      height: 6px;
      background: linear-gradient(90deg, var(--vert-gabon), var(--jaune-gabon), var(--bleu-gabon));
      border-radius: 3px;
      margin-bottom: 2rem;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--vert-gabon);
      text-decoration: none;
      font-weight: 600;
      margin-bottom: 2rem;
      transition: gap 0.2s;
    }
    .back-link:hover { gap: 10px; }
  </style>
</head>
<body>

<div class="flag-background">
  <div class="flag-band flag-band-vert"></div>
  <div class="flag-band flag-band-jaune"></div>
  <div class="flag-band flag-band-bleu"></div>
</div>
<div class="flag-overlay"></div>

<div class="shapes-container">
  <div class="shape shape-1"></div>
  <div class="shape shape-3"></div>
  <div class="shape shape-5"></div>
  <div class="shape shape-7"></div>
</div>

<div class="page-content">
  <nav class="navbar">
    <a href="index.html" class="navbar-brand">
      <div class="brand-flag">
        <span class="bf-vert"></span>
        <span class="bf-jaune"></span>
        <span class="bf-bleu"></span>
      </div>
      <span class="brand-text">GABON <span>STORIES</span></span>
    </a>
    <ul class="navbar-nav">
      <li><a href="index.html">Accueil</a></li>
      <li><a href="histoires.html">Histoires</a></li>
    </ul>
    <div class="navbar-actions" id="navActions"></div>
  </nav>

  <div class="story-reader">
    <a href="histoires.html" class="back-link">← Retour aux histoires</a>

    <div id="storyContent">
      <div class="empty-state">
        <div class="empty-state-icon">⏳</div>
        <h3>Chargement de l'histoire...</h3>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-flag">
      <span style="background:var(--vert-gabon)"></span>
      <span style="background:var(--jaune-gabon)"></span>
      <span style="background:var(--bleu-gabon)"></span>
    </div>
    <p>🇬🇦 <strong>Gabon Stories</strong></p>
  </footer>
</div>

<script src="js/app.js"></script>
<script>
  async function loadStory() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const container = document.getElementById('storyContent');

    if (!id) {
      container.innerHTML = `<div class="alert alert-error">Aucun identifiant d'histoire fourni.</div>`;
      return;
    }

    try {
      const res = await API.get('getStory', { id });
      if (res.success) {
        const s = res.story;
        document.title = `${s.title} — Gabon Stories`;
        // Formatter le contenu (paragraphes)
        const formattedContent = s.content
          .split('\n\n')
          .filter(p => p.trim())
          .map(p => `<p>${escapeHtml(p.trim())}</p>`)
          .join('');

        container.innerHTML = `
          <div class="story-header-banner"></div>
          <h1 style="font-family:'Playfair Display',serif; font-size:2.2rem; line-height:1.25; margin-bottom:1.5rem; color:var(--texte-sombre);">
            ${escapeHtml(s.title)}
          </h1>
          <div class="story-meta">
            <div style="display:flex;align-items:center;gap:8px;">
              <div class="avatar" style="width:45px;height:45px;font-size:1rem;">${getInitials(s.authorName)}</div>
              <div>
                <div style="font-weight:700; color:var(--texte-sombre);">${escapeHtml(s.authorName)}</div>
                <div style="font-size:0.8rem;color:#888;">Auteur</div>
              </div>
            </div>
            <span style="color:#aaa">·</span>
            <span style="font-size:0.9rem;color:var(--texte-moyen);">📅 ${formatDate(s.createdAt)}</span>
            <span style="color:#aaa">·</span>
            <span style="font-size:0.9rem;color:var(--texte-moyen);">👁 ${s.views} lectures</span>
          </div>
          <hr class="divider">
          <div class="story-content-text">${formattedContent || escapeHtml(s.content)}</div>
          <hr class="divider">
          <div style="text-align:center;padding:2rem 0;">
            <p style="color:var(--texte-moyen);margin-bottom:1rem;">Vous avez aimé cette histoire ?</p>
            <a href="histoires.html" class="btn btn-primary">📚 Découvrir d'autres histoires</a>
          </div>
        `;
      } else {
        container.innerHTML = `<div class="alert alert-error">❌ ${res.message || 'Histoire introuvable'}</div>`;
      }
    } catch(e) {
      container.innerHTML = `<div class="alert alert-error">⚠️ Erreur lors du chargement. Vérifiez la connexion à l'API.</div>`;
    }
  }

  document.addEventListener('DOMContentLoaded', loadStory);
</script>
</body>
</html>
